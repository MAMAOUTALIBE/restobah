<div class="crm-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="crm-required" aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<p class="crm-field-error" id="{{ field.auto_id }}_error_{{ forloop.counter }}">{{ error }}</p>{% endfor %}
</div>
