# Local container review; production uses Caddy + automatic HTTPS.
log_format stc_safe '$remote_addr - $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=stc_admin:10m rate=5r/m;
# Behind a host reverse proxy (compose.vps.yaml): keep the client address and the HTTPS scheme it sends.
# Only Docker/loopback networks are trusted; this container port is never published publicly.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
map $http_x_forwarded_proto $stc_forwarded_proto {
    default $scheme;
    https https;
}
# HSTS for the pages served by nginx itself, only when the visitor came over HTTPS (Django adds its own).
map $stc_forwarded_proto $stc_hsts {
    https "max-age=31536000; includeSubDomains";
    default "";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log stc_safe;
    server_tokens off;
    client_max_body_size 8m;
    include /etc/nginx/snippets/stc-security-headers.conf;
    location = /admin/login/ {
        limit_req zone=stc_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $stc_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $stc_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 45s;
    }
    location /media/ {
        alias /media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/stc-security-headers.conf; add_header Strict-Transport-Security $stc_hsts always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; include /etc/nginx/snippets/stc-security-headers.conf; add_header Strict-Transport-Security $stc_hsts always; }
    location / { include /etc/nginx/snippets/stc-security-headers.conf; add_header Strict-Transport-Security $stc_hsts always; try_files $uri $uri/ /index.html; }
}
